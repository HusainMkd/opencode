name: Sync Upstream Changes

on:
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force merge even with conflicts'
        required: false
        type: boolean
        default: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
    
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
    
      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/anomalyco/opencode.git
          git fetch upstream
    
      - name: Create sync branch
        run: |
          git checkout -b sync/upstream-$(date +%Y%m%d-%H%M%S)
          git reset --hard upstream/dev
    
      - name: Apply our sidebar changes
        run: |
          # Create a patch file with our changes
          git checkout dev
          git format-patch --stdout HEAD~1 > sidebar-stats.patch

          # Go back to sync branch and apply
          git checkout sync/upstream-*
          git am sidebar-stats.patch || {
            echo "Patch application failed, creating manual PR"
            exit 1
          }
    
      - name: Build and test
        run: |
          cd packages/opencode
          bun install
          bun run build
    
      - name: Create Pull Request
        run: |
          git push origin sync/upstream-*
          gh pr create \
            --title "feat: sync upstream changes with sidebar stats" \
            --body "Automated sync from upstream with sidebar stats feature preserved.

          Changes from upstream:
          - $(git log --oneline upstream/dev ^HEAD~1 | wc -l) commits merged
          - Latest upstream: $(git rev-parse --short upstream/dev)

          This PR maintains the sidebar stats implementation while bringing in latest upstream changes." \
            --base dev \
            --head sync/upstream-*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge to dev if successful
        if: success()
        run: |
          git checkout dev
          git merge sync/upstream-*
          git push origin dev
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}